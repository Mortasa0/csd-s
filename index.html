<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وزارة النفط - قسم التصاريح الأمنية</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: #ffffff;
      color: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 40px;
      text-align: center;
    }

    /* الشعار - أكبر */
    .logo {
      width: 160px;
      height: 160px;
      margin-bottom: 25px;
      object-fit: contain;
    }

    /* العناوين */
    .ministry {
      font-size: 22px;
      font-weight: 700;
      color: #000;
      margin-bottom: 10px;
    }

    .dept-red {
      font-size: 19px;
      font-weight: 700;
      color: #d40000;
      margin-bottom: 10px;
    }

    .dept-black {
      font-size: 19px;
      font-weight: 700;
      color: #000;
      margin-bottom: 90px;
    }

    /* النص الترحيبي - سطر واحد */
    .welcome {
      font-size: 19px;
      font-weight: 700;
      color: #000;
      line-height: 1.8;
      margin-bottom: 55px;
      max-width: 700px;
    }

    /* سطر التحقق */
    .verify-line {
      font-size: 18px;
      font-weight: 700;
      color: #000;
    }

    .verify-link {
      color: #d40000;
      text-decoration: underline;
      text-decoration-color: #d40000;
      text-underline-offset: 4px;
      cursor: pointer;
      font-weight: 700;
      background: none;
      border: none;
      font-family: inherit;
      font-size: inherit;
      padding: 0;
    }

    .verify-link:hover {
      color: #a00000;
    }

    /* موبايل */
    @media (max-width: 600px) {
      body { padding: 50px 20px 30px; }
      .logo { width: 130px; height: 130px; margin-bottom: 20px; }
      .ministry { font-size: 20px; margin-bottom: 8px; }
      .dept-red { font-size: 17px; margin-bottom: 8px; }
      .dept-black { font-size: 17px; margin-bottom: 70px; }
      .welcome { font-size: 17px; margin-bottom: 45px; }
      .verify-line { font-size: 16px; }
    }
  </style>
</head>
<body>

  <img src="logo.png" alt="شعار وزارة النفط" class="logo">

  <div class="ministry">وزارة النفط</div>
  <div class="dept-red">قسم التصاريح الأمنية</div>
  <div class="dept-black">شعبة التصاريح الجنوبية</div>

  <div class="welcome">
    تهديكم شعبة التصاريح الأمنية المنطقة الجنوبية تحياتها
  </div>

  <div class="verify-line">
    للتحقق من صحة الصدور
    <button onclick="openPDF()" class="verify-link">أضغط هنا</button>
  </div>

  <script>
    function openPDF() {
      var url = 'https://mortasa0.github.io/csd-s/954884-20D8ADD98.pdf';
      var win = window.open(url, '_blank');
      if (!win) {
        window.location.href = url;
      }
    }
  </script>

</body>
</html>
